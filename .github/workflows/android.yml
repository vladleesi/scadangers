name: Android CI and release
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected one stable SemVer versionName in app/build.gradle.kts" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The deprecated SDK package 'tools' is no longer available from sdkmanager.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleRelease test lint ktlintCheck detekt :app:assembleDebugAndroidTest :app:dependencyInventory --no-daemon
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/audit_dependencies.py app/build/reports/dependencies/coordinates.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '24'
            target: default
            ram: 2048M
          - api: '37.0'
            target: google_apis_ps16k
            ram: 4096M
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: ${{ matrix.ram }}
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
  required:
    name: Android checks
    if: needs.verify.result == 'success' && needs.instrumentation.result == 'success'
    needs: [verify, instrumentation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require build and device checks
        env:
          BUILD_RESULT: ${{ needs.verify.result }}
          DEVICE_RESULT: ${{ needs.instrumentation.result }}
        run: test "$BUILD_RESULT" = success && test "$DEVICE_RESULT" = success
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'vladleesi/scadangers'
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      main_sha: ${{ steps.promotion.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Promote checked develop commit to main
        id: promotion
        shell: bash
        run: |
          tip=$(git ls-remote --exit-code origin refs/heads/develop | cut -f1)
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo "Develop has advanced; skipping stale promotion."
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/main"
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          [[ "$main_sha" == "$GITHUB_SHA" ]] || { echo "Main changed during promotion" >&2; exit 1; }
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
  release:
    if: needs.promote.outputs.main_sha != ''
    needs: [verify, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
      EXPECTED_MAIN_SHA: ${{ needs.promote.outputs.main_sha }}
      RELEASE_NOTES_FILE: ${{ github.workspace }}/scadangers-release-notes.md
    steps:
      - name: Check out main for release
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify main release source
        id: source
        shell: bash
        run: |
          [[ "$(git symbolic-ref --short HEAD)" == main ]] || { echo "Release checkout must be main" >&2; exit 1; }
          main_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$main_sha" != "$EXPECTED_MAIN_SHA" || "$remote_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "Main has advanced; skipping stale release."
            exit 0
          fi
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Main version does not match release tag" >&2; exit 1; }
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
      - name: Check main release tag
        id: tag
        if: steps.source.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="refs/tags/$RELEASE_TAG"
          tagged=$(git ls-remote --sort=refname origin "$ref" "${ref}^{}" | tail -n 1 | cut -f1)
          if [[ -n "$tagged" ]]; then
            git fetch --no-tags origin "$ref"
            git merge-base --is-ancestor "$tagged" HEAD || { echo "$RELEASE_TAG is outside main history" >&2; exit 1; }
          fi
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>"$error_file"); then
            [[ "$draft" == false && -n "$tagged" ]] || { echo "Review the existing release for $RELEASE_TAG" >&2; exit 1; }
            echo "update_notes=true" >> "$GITHUB_OUTPUT"
            echo "notes_ref=$tagged" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q 'release not found' "$error_file"; then
            cat "$error_file" >&2
            exit 1
          fi
          if [[ -n "$tagged" && "$tagged" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "$RELEASE_TAG already points to a different main commit" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "create_tag=$([[ -z "$tagged" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "notes_ref=$EXPECTED_MAIN_SHA" >> "$GITHUB_OUTPUT"
      - name: Prepare version changelog notes
        if: steps.source.outputs.current == 'true'
        env:
          NOTES_REF: ${{ steps.tag.outputs.notes_ref }}
        run: git show "$NOTES_REF:CHANGELOG.md" | python3 tools/release_notes.py "${RELEASE_TAG#v}" > "$RELEASE_NOTES_FILE"
      - name: Create version tag from main
        if: steps.tag.outputs.create_tag == 'true'
        env:
          MAIN_SHA: ${{ steps.source.outputs.main_sha }}
        run: git push origin "$MAIN_SHA:refs/tags/$RELEASE_TAG"
      - name: Publish GitHub release from main
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target main --verify-tag --title "Scadangers ${RELEASE_TAG#v}" --notes-file "$RELEASE_NOTES_FILE"
      - name: Update existing release changelog description
        if: steps.tag.outputs.update_notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RELEASE_NOTES_FILE"
