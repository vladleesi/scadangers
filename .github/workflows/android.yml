name: Android CI and release
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected one stable SemVer versionName in app/build.gradle.kts" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The deprecated SDK package 'tools' is no longer available from sdkmanager.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:assembleRelease test lint ktlintCheck detekt :app:assembleDebugAndroidTest :app:dependencyInventory --no-daemon
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/audit_dependencies.py app/build/reports/dependencies/coordinates.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '24'
            target: default
            ram: 2048M
          - api: '37.0'
            target: google_apis_ps16k
            ram: 4096M
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: ${{ matrix.ram }}
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumentation-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
  required:
    name: Android checks
    if: always()
    needs: [verify, instrumentation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require build and device checks
        env:
          BUILD_RESULT: ${{ needs.verify.result }}
          DEVICE_RESULT: ${{ needs.instrumentation.result }}
        run: test "$BUILD_RESULT" = success && test "$DEVICE_RESULT" = success
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'vladleesi/scadangers'
    needs: [verify, required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check develop tip
        id: tip
        shell: bash
        run: |
          tip=$(git ls-remote --exit-code origin refs/heads/develop | cut -f1)
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check release tag
        id: release
        if: steps.tip.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$draft" == false ]] || { echo "Review the existing draft for $RELEASE_TAG" >&2; exit 1; }
            exit 0
          fi
          ref="refs/tags/$RELEASE_TAG"
          tagged=$(git ls-remote --sort=refname origin "$ref" "${ref}^{}" | tail -n 1 | cut -f1)
          if [[ -n "$tagged" && "$tagged" != "$GITHUB_SHA" ]]; then
            echo "$RELEASE_TAG already points to a different commit" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "create_tag=$([[ -z "$tagged" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Fast-forward main
        if: steps.tip.outputs.current == 'true'
        run: git push origin "$GITHUB_SHA:refs/heads/main"
      - name: Create version tag
        if: steps.release.outputs.create_tag == 'true'
        run: git push origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"
      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Scadangers ${RELEASE_TAG#v}" --generate-notes
